version: "3.8"

###############################################################################
# tp-gen — Production Docker Compose
#
# Copy .env.example → .env and fill in all values before first start.
# Start: docker-compose up -d
###############################################################################

services:

  # ===========================================================================
  # NGINX — Main reverse proxy
  # Handles SSL termination, bot detection → dynamic renderer, SPA serving,
  # Supabase API routing, Plausible routing.
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: tp-gen-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/nginx/certs:ro
      - nginx-webroot:/var/www/certbot
    depends_on:
      - app
      - dynamic-renderer
      - kong
      - plausible
    networks:
      - tp-network

  # ===========================================================================
  # APP — React SPA (built static files served by nginx)
  # ===========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${ANON_KEY}
        VITE_REDIRECT_URL: ${VITE_REDIRECT_URL}
    container_name: tp-gen-app
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      tp-network:
        aliases:
          - react-frontend   # 'app' is a preloaded HSTS gTLD — Chromium forces HTTPS on it

  # ===========================================================================
  # DYNAMIC RENDERER — Puppeteer pre-rendering for crawlers/bots
  # Nginx routes bot User-Agents here; returns fully rendered HTML.
  # ===========================================================================
  dynamic-renderer:
    build:
      context: ./docker/dynamic-renderer
      dockerfile: Dockerfile
    container_name: tp-gen-renderer
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - APP_ORIGIN=http://react-frontend:8080
      - SUPABASE_PUBLIC_URL=${API_EXTERNAL_URL}
      - SUPABASE_INTERNAL_URL=http://kong:8000
      - SUPABASE_ANON_KEY=${ANON_KEY}
      - CACHE_TTL_SECONDS=3600
      - PORT=3000
    depends_on:
      - app
    networks:
      - tp-network

  # ===========================================================================
  # SUPABASE STACK
  # ===========================================================================

  # PostgreSQL database
  db:
    image: supabase/postgres:15.8.1.085
    container_name: tp-gen-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - tp-network

  # Kong API Gateway
  kong:
    image: kong:2.8.1
    container_name: tp-gen-kong
    restart: unless-stopped
    expose:
      - "8000"
      - "8443"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-supabase}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    volumes:
      - ./docker/kong/kong.yml:/var/lib/kong/kong.yml:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tp-network

  # GoTrue — Auth service
  auth:
    image: supabase/gotrue:v2.186.0
    container_name: tp-gen-auth
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgresql://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres

      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: false

      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET}

      GOTRUE_EXTERNAL_EMAIL_ENABLED: true
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: false
      GOTRUE_MAILER_AUTOCONFIRM: false
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify

      # Email via Resend SMTP (GoTrue v2.186+ restricts HTTP hooks to localhost only)
      GOTRUE_SMTP_HOST: smtp.resend.com
      GOTRUE_SMTP_PORT: 465
      GOTRUE_SMTP_USER: resend
      GOTRUE_SMTP_PASS: ${RESEND_API_KEY}
      GOTRUE_SMTP_ADMIN_EMAIL: ${AUTH_EMAIL_FROM}
      GOTRUE_SMTP_SENDER_NAME: ${AUTH_EMAIL_FROM_NAME}

      # Custom email templates (mounted below)
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: /templates/confirm-signup.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: /templates/recovery.html
      GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE: /templates/email-change.html
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: /templates/magic-link.html
    volumes:
      - ./supabase/templates/emails:/templates:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tp-network

  # PostgREST — Auto-generated REST API
  rest:
    image: postgrest/postgrest:v14.5
    container_name: tp-gen-rest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgresql://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: false
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: 3600
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tp-network

  # Supabase Realtime
  realtime:
    image: supabase/realtime:v2.76.5
    container_name: tp-gen-realtime
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sSfL", "--head", "-o", "/dev/null",
             "-H", "Authorization: Bearer ${ANON_KEY}",
             "http://localhost:4000/api/tenants/realtime-dev/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      FLY_ALLOC_ID: fly123
      FLY_APP_NAME: realtime
      SECRET_KEY_BASE: ${REALTIME_SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      ENABLE_TAILSCALE: false
      DNS_NODES: "''"
      RLIMIT_NOFILE: ""
      APP_NAME: realtime
      SEED_SELF_HOST: true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tp-network

  # Supabase Storage API
  storage:
    image: supabase/storage-api:v1.37.8
    container_name: tp-gen-storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgresql://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001
    volumes:
      - storage-data:/var/lib/storage
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
      imgproxy:
        condition: service_started
    networks:
      - tp-network

  # imgproxy — Image transformations for Storage
  imgproxy:
    image: darthsim/imgproxy:v3.30.1
    container_name: tp-gen-imgproxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
    volumes:
      - storage-data:/var/lib/storage:ro
    networks:
      - tp-network

  # Postgres Meta API (used by Studio)
  meta:
    image: supabase/postgres-meta:v0.95.2
    container_name: tp-gen-meta
    restart: unless-stopped
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      PG_META_DB_SSL_MODE: disable
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tp-network

  # Deno Edge Runtime — runs supabase/functions/
  edge-runtime:
    image: supabase/edge-runtime:v1.70.3
    container_name: tp-gen-edge-runtime
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      # JWT verification is handled by Kong for external calls.
      # Internal callers (GoTrue hook) use webhook signature instead.
      VERIFY_JWT: "false"
      # Secrets for edge functions
      RESEND_API_KEY: ${RESEND_API_KEY}
      GOTRUE_HOOK_SECRET: ${GOTRUE_HOOK_SECRET}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM}
      AUTH_EMAIL_FROM_NAME: ${AUTH_EMAIL_FROM_NAME:-zenit-it}
    volumes:
      - ./supabase/functions:/home/deno/functions:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tp-network
    command:
      - start
      - --main-service
      - /home/deno/functions/main

  # Supabase Studio — Admin dashboard (localhost only, access via SSH tunnel)
  studio:
    image: supabase/studio:2026.02.16-sha-26c615c
    container_name: tp-gen-studio
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e",
             "fetch('http://localhost:3000/api/platform/profile').then(r=>r.ok?process.exit(0):process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Only accessible from localhost (SSH tunnel: ssh -L 3001:localhost:3001 user@server)
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: zenit-it
      DEFAULT_PROJECT_NAME: tp-gen

      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${API_EXTERNAL_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}

      AUTH_JWT_SECRET: ${JWT_SECRET}

      NEXT_PUBLIC_ENABLE_LOGS: "false"
      NEXT_ANALYTICS_BACKEND_PROVIDER: postgres
    depends_on:
      db:
        condition: service_healthy
      kong:
        condition: service_started
      meta:
        condition: service_started
    networks:
      - tp-network

  # ===========================================================================
  # PLAUSIBLE ANALYTICS
  # ===========================================================================

  plausible-db:
    image: postgres:15-alpine
    container_name: tp-gen-plausible-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: plausible
      POSTGRES_USER: plausible
      POSTGRES_PASSWORD: ${PLAUSIBLE_DB_PASSWORD}
    volumes:
      - plausible-db-data:/var/lib/postgresql/data
    networks:
      - tp-network

  events-db:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: tp-gen-events-db
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: plausible_events_db
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${PLAUSIBLE_CLICKHOUSE_PASSWORD}
    volumes:
      - events-db-data:/var/lib/clickhouse
      - ./docker/clickhouse/clickhouse-config.xml:/etc/clickhouse-server/config.d/logging.xml:ro
      - ./docker/clickhouse/clickhouse-user-config.xml:/etc/clickhouse-server/users.d/logging.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - tp-network

  plausible:
    image: ghcr.io/plausible/community-edition:v2
    container_name: tp-gen-plausible
    restart: unless-stopped
    command: sh -c "sleep 10 && /entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    expose:
      - "8001"
    environment:
      BASE_URL: ${PLAUSIBLE_BASE_URL}
      SECRET_KEY_BASE: ${PLAUSIBLE_SECRET_KEY_BASE}
      DATABASE_URL: postgresql://plausible:${PLAUSIBLE_DB_PASSWORD}@plausible-db:5432/plausible
      CLICKHOUSE_DATABASE_URL: http://clickhouse:${PLAUSIBLE_CLICKHOUSE_PASSWORD}@events-db:8123/plausible_events_db
      DISABLE_REGISTRATION: invite_only
      # No mailer configured — manage admin accounts via CLI:
      # docker exec tp-gen-plausible /app/bin/plausible accounts
    depends_on:
      - plausible-db
      - events-db
    networks:
      - tp-network

###############################################################################
# Volumes
###############################################################################
volumes:
  db-data:
  storage-data:
  plausible-db-data:
  events-db-data:
  nginx-webroot:

###############################################################################
# Networks
###############################################################################
networks:
  tp-network:
    driver: bridge
