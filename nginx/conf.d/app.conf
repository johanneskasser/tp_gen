# =============================================================================
# tp-gen — Site Configuration
#
# Replace YOUR_DOMAIN with your actual domain (e.g. zenit-it.fit).
# SSL: obtain certs via certbot (see README) then uncomment HTTPS blocks.
# =============================================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN analytics.YOUR_DOMAIN;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# Main app — https://YOUR_DOMAIN
# =============================================================================
server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    ssl_certificate     /etc/nginx/certs/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # Supabase API — PostgREST, Auth, Storage, Realtime, Edge Functions
    # All routed through Kong gateway
    # -------------------------------------------------------------------------
    location /rest/v1/ {
        proxy_pass http://kong:8000/rest/v1/;
    }

    location /auth/v1/ {
        proxy_pass http://kong:8000/auth/v1/;
    }

    location /storage/v1/ {
        proxy_pass http://kong:8000/storage/v1/;
        client_max_body_size 52m;
    }

    location /realtime/v1/ {
        proxy_pass http://kong:8000/realtime/v1/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /functions/v1/ {
        proxy_pass http://kong:8000/functions/v1/;
    }

    # -------------------------------------------------------------------------
    # React SPA — serve static files
    # Bots get pre-rendered HTML from dynamic renderer
    # -------------------------------------------------------------------------
    location / {
        # Route known bots to Puppeteer pre-renderer
        if ($is_prerender = 1) {
            proxy_pass http://dynamic-renderer:3000;
            break;
        }

        # Regular users get the React SPA via the app container
        proxy_pass http://app:8080;
    }
}

# =============================================================================
# Plausible Analytics — https://analytics.YOUR_DOMAIN
# =============================================================================
server {
    listen 443 ssl http2;
    server_name analytics.YOUR_DOMAIN;

    ssl_certificate     /etc/nginx/certs/analytics.YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/analytics.YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://plausible:8001;
    }
}
